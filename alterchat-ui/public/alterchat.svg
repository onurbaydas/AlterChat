<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f19"/>
      <stop offset="1" stop-color="#090a08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#7cff6b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cff6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7066"/>
      <stop offset="1" stop-color="#433c35"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#glow)"/>
  <!-- hazard stripe at the bottom -->
  <clipPath id="clip"><rect x="32" y="32" width="960" height="960" rx="220"/></clipPath>
  <g clip-path="url(#clip)">
    <rect x="0" y="842" width="1024" height="60" fill="#c99a1e"/>
    <g fill="#1a1a14">
      <path d="M0 842h50l-60 60h-50z M120 842h50l-60 60H60z M240 842h50l-60 60h-50z M360 842h50l-60 60h-50z M480 842h50l-60 60h-50z M600 842h50l-60 60h-50z M720 842h50l-60 60h-50z M840 842h50l-60 60h-50z M960 842h50l-60 60h-50z M1080 842h50l-60 60h-50z"/>
    </g>
  </g>
  <!-- rat head (profile, facing right) -->
  <g transform="translate(-20 30)">
    <!-- ear -->
    <ellipse cx="360" cy="300" rx="120" ry="130" fill="#5f574e"/>
    <ellipse cx="368" cy="310" rx="76" ry="86" fill="#d89a93"/>
    <!-- head + snout -->
    <path d="M300 470 C300 360 420 330 520 360 C640 395 760 440 820 500 C760 560 640 590 520 600 C400 610 300 570 300 470 z" fill="url(#fur)"/>
    <!-- nose -->
    <circle cx="822" cy="500" r="26" fill="#e0a39b"/>
    <!-- whiskers -->
    <g stroke="#e6e0d2" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <path d="M770 505 L900 450 M770 515 L910 520 M770 525 L895 590"/>
    </g>
    <!-- eye lit by the screen -->
    <circle cx="610" cy="440" r="34" fill="#0b0b0b"/>
    <circle cx="624" cy="428" r="12" fill="#9dff8f"/>
    <!-- headset -->
    <path d="M270 380 C290 220 470 200 520 330" fill="none" stroke="#151515" stroke-width="34" stroke-linecap="round"/>
    <rect x="236" y="420" width="76" height="120" rx="30" fill="#151515"/>
    <path d="M290 540 C330 640 500 660 640 610" fill="none" stroke="#151515" stroke-width="16" stroke-linecap="round"/>
    <circle cx="646" cy="607" r="20" fill="#ff5b3a"/>
  </g>
</svg>
