name: Bootstrap Docker image

# Publishes ghcr.io/onurbaydas/alterchat-bootstrap
#   :edge     on every push to main that touches the bootstrap node
#   (version tags :X.Y.Z / :latest are pushed by release.yml)
# Pull requests only build the image (no push).

on:
  push:
    branches: ["main"]
    paths:
      - "alterchat-bootstrap/**"
      - "alterchat-core/**"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "alterchat-bootstrap/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/alterchat-bootstrap
          tags: |
            type=edge,branch=main
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: alterchat-bootstrap/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
