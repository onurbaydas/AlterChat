name: Bootstrap Docker image

# Publishes ghcr.io/onurbaydas/alterchat-bootstrap
#   :edge     on every push to main that touches the bootstrap node
#   (version tags :X.Y.Z / :latest are pushed by release.yml)
# Pull requests only build the image (no push).

on:
  push:
    branches: ["main"]
    paths:
      - "alterchat-bootstrap/**"
      - "alterchat-core/**"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "alterchat-bootstrap/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alterchat-bootstrap
          tags: |
            type=edge,branch=main
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: alterchat-bootstrap/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
