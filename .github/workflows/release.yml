name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches app version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare tag with tauri.conf.json / package.json / Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version alterchat-ui/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version alterchat-ui/package.json)
          crate=$(grep -m1 '^version' alterchat-ui/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$crate"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match the app version. Bump all three files first (see RELEASING.md)."
            exit 1
          fi
      - name: Check Tauri npm packages match Rust crates
        run: python3 scripts/check_tauri_versions.py .

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build runs on both Apple Silicon and Intel.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            targets: ""
          - platform: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Optional code-signing secrets. When they are not configured the
      # release is still built, just unsigned. The Apple values are NOT set
      # under their APPLE_* names here: Tauri starts codesigning as soon as
      # APPLE_CERTIFICATE exists, even when it is empty. The step below
      # exports them only when the secret is actually configured.
      MAC_CERT: ${{ secrets.APPLE_CERTIFICATE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Same version as rust-toolchain.toml, so the extra targets are added
      # to the toolchain that actually builds.
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.targets }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf

      # Tauri imports the certificate and notarizes by itself once these
      # variables exist.
      - name: Enable Apple code signing (only if configured)
        if: runner.os == 'macOS' && env.MAC_CERT != ''
        env:
          C_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          C_IDENT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          C_ID: ${{ secrets.APPLE_ID }}
          C_PW: ${{ secrets.APPLE_PASSWORD }}
          C_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE<<EOF_CERT"; echo "$MAC_CERT"; echo "EOF_CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$C_PASS"
            echo "APPLE_SIGNING_IDENTITY=$C_IDENT"
            echo "APPLE_ID=$C_ID"
            echo "APPLE_PASSWORD=$C_PW"
            echo "APPLE_TEAM_ID=$C_TEAM"
          } >> "$GITHUB_ENV"

      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $env:WINDOWS_CERTIFICATE | Out-File -Encoding ascii certificate.txt
          certutil -decode certificate.txt certificate.pfx
          certutil -importpfx -p "$env:WINDOWS_CERTIFICATE_PASSWORD" certificate.pfx
          Remove-Item certificate.txt, certificate.pfx

      - name: Install frontend dependencies
        working-directory: alterchat-ui
        run: npm ci

      # Secrets pasted from a shell often carry a trailing CR/LF, which makes
      # the key undecodable or the password wrong. Strip them once here.
      - name: Normalise updater signing secrets
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key=$(printf '%s' "$RAW_KEY" | tr -d '\r\n')
          pass=$(printf '%s' "$RAW_PASS" | tr -d '\r\n')
          echo "::add-mask::$key"
          echo "::add-mask::$pass"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) come from the step above; the
          # app verifies update bundles with the public key in tauri.conf.json.
        with:
          projectPath: alterchat-ui
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "AlterChat ${{ github.ref_name }}"
          releaseBody: |
            ## İndir / Download

            | Sistem / OS | Dosya / File |
            | --- | --- |
            | Windows 10/11 | `AlterChat_*_x64-setup.exe` (yönetici izni gerekmez / no admin needed) |
            | macOS (Apple Silicon / Intel) | `AlterChat_*.dmg` |
            | Linux | `AlterChat_*.AppImage` veya/or `.deb` / `.rpm` |
            | Bootstrap düğümü / node | `alterchat-bootstrap-linux-x86_64` veya/or `ghcr.io/onurbaydas/alterchat-bootstrap:${{ github.ref_name }}` |

            Zaten kuruluysa uygulama bu sürümü kendisi önerir. / Existing installs offer this update automatically.

            **Doğrulama / Verify:** `sha256sum -c SHA256SUMS` — ayrıca/also `gh attestation verify <file> -R onurbaydas/AlterChat`.

            Önce denemek için / Try first: https://onurbaydas.github.io/AlterChat/

            Değişiklikler / Changes: [CHANGELOG.md](https://github.com/onurbaydas/AlterChat/blob/${{ github.ref_name }}/CHANGELOG.md)
          # Published (not draft) so /releases/latest/download/latest.json
          # resolves for the in-app updater.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  bootstrap:
    name: Bootstrap node (linux x86_64)
    runs-on: ubuntu-22.04
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
        with:
          toolchain: 1.96.0
      - run: cargo build --release -p alterchat-bootstrap
      - name: Package
        run: |
          mkdir dist
          cp target/release/alterchat-bootstrap dist/alterchat-bootstrap-linux-x86_64
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber

  checksums:
    name: Checksums and provenance
    runs-on: ubuntu-22.04
    needs: [release, bootstrap]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Software bill of materials (SPDX) for the Rust and npm dependency
      # trees; it is listed in SHA256SUMS and covered by the attestation.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: alterchat-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "alterchat-${{ github.ref_name }}.spdx.json" -R "${{ github.repository }}" --clobber
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" \
            --pattern '*' --skip-existing
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" assets/SHA256SUMS -R "${{ github.repository }}" --clobber

  docker:
    name: Bootstrap Docker image (ghcr.io)
    runs-on: ubuntu-22.04
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alterchat-bootstrap
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: alterchat-bootstrap/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
