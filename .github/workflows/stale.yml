name: Stale issues

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "security,pinned,roadmap"
          exempt-pr-labels: "security,pinned"
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            Bu issue 60 gündür hareketsiz; 14 gün içinde yorum gelmezse kapanacak.
            This issue has been inactive for 60 days and will close in 14 days without activity.
          stale-pr-message: >
            Bu PR 60 gündür hareketsiz; 14 gün içinde güncellenmezse kapanacak.
            This PR has been inactive for 60 days and will close in 14 days without activity.
