name: Live demo (GitHub Pages)

# Builds the desktop UI against a simulated in-browser backend and publishes it
# to https://onurbaydas.github.io/AlterChat/. No real network traffic happens
# in the demo.

on:
  push:
    branches: ["main"]
    paths:
      - "alterchat-ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alterchat-ui/package-lock.json
      - run: npm ci
        working-directory: alterchat-ui
      - run: npm run build:demo
        working-directory: alterchat-ui
      - name: SPA fallback
        run: cp alterchat-ui/dist-demo/index.html alterchat-ui/dist-demo/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: alterchat-ui/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
