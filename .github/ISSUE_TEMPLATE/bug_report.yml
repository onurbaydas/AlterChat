name: Hata bildirimi / Bug report
description: Tekrarlanabilir bir sorun bildirin / Report a reproducible problem
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Güvenlik açığı mı? Lütfen burada **açmayın**, [SECURITY.md](https://github.com/onurbaydas/AlterChat/blob/main/SECURITY.md) üzerinden gizli bildirin.
        Security vulnerability? Please do **not** file it here — report it privately via [SECURITY.md](https://github.com/onurbaydas/AlterChat/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Ne oldu? / What happened?
      description: Beklenen ve gerçekleşen davranış / Expected vs. actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adımları / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AlterChat sürümü / version
      placeholder: "0.1.0 (Ayarlar → Hakkında / Settings → About)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: İşletim sistemi / Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Diğer / Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Bileşen / Component
      options:
        - Masaüstü uygulaması / Desktop app
        - Bootstrap düğümü / Bootstrap node
        - Çekirdek kütüphane / Core library
        - Canlı demo / Live demo
  - type: textarea
    id: logs
    attributes:
      label: Loglar / Logs
      description: Özel anahtarları, şifreleri, mesaj içeriklerini ve peer ID'lerini silin. / Strip keys, passwords, message contents and peer IDs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Kontrol / Checklist
      options:
        - label: Bu bir güvenlik açığı değil (öyleyse SECURITY.md kullanacağım) / This is not a security vulnerability
          required: true
        - label: Benzer bir issue aradım / I searched for existing issues
          required: true
