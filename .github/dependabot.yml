version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      # Patch/minor bumps land as one PR per week instead of many.
      rust-minor:
        update-types: ["minor", "patch"]
    ignore:
      # automerge majors/minors need protocol review.
      - dependency-name: "automerge"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: "/alterchat-ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
      tauri:
        patterns: ["@tauri-apps/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/alterchat-bootstrap"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
