[package]
name = "alterchat-core"
version = "0.1.0"
edition = "2024"
description = "Protocol, cryptography, storage and networking core for AlterChat"
license = "AGPL-3.0-only"
repository = "https://github.com/onurbaydas/AlterChat"
publish = false

[dependencies]
aead = "0.5.2"
aes-gcm = "0.10.3"
anyhow = "1.0.102"
argon2 = "0.5.3"
automerge = "0.9.0"
base64 = "0.22.1"
bincode = "1.3.3"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
libp2p = { version = "0.57.1", features = ["tcp", "dns", "websocket", "noise", "yamux", "kad", "gossipsub", "tokio", "macros", "ed25519", "identify", "ping", "mdns", "request-response", "cbor", "relay", "dcutr", "quic"] }
libp2p-community-tor = { path = "../libp2p-community-tor" }
ml-kem = { version = "0.3.2", features = ["zeroize", "getrandom"] }
pbkdf2 = "0.13.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sysinfo = "0.40.4"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasmi = { version = "2.0.2", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
# arti links SQLite through rusqlite; the app enables bundled SQLCipher. This
# lets `cargo test -p alterchat-core` link on its own, without a system SQLite.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
wat = "1.251.0"
