# cargo audit configuration.
#
# Every ignored advisory below is pulled in by a dependency whose fix is not
# yet selectable. Each entry states why it does not apply and must be
# removed as soon as a fixed version can be used. New advisories still fail CI.

[advisories]
ignore = [
  # --- arti 0.48 (issue #35 done; these remain upstream) ---
  # libsqlite3-sys 0.38: only one libsqlite3-sys may be linked, and arti
  # 0.48's tor-dirmgr requires rusqlite >=0.36,<0.41, so the patched
  # libsqlite3-sys 0.39 (rusqlite 0.41) cannot be selected yet. Even 0.39's
  # bundled SQLCipher (sqlcipher-src 419.0.6, SQLite 3.53.4) is still
  # affected. Exposure needs a crafted database + -wal pair written by a less
  # trusted party; AlterChat only opens its own profile database.
  "RUSTSEC-2026-0459",
  # rsa 0.9 (Marvin timing attack) via tor-llcrypto / tor-key-forge
  # (ssh-key-fork-arti). AlterChat uses arti only as a Tor client: RSA is used
  # to verify Tor directory and relay signatures, never to decrypt with a
  # local private key. No arti release uses the fixed rsa 0.10 yet.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5 via elliptic-curve/p256, an optional dependency of
  # ssh-key-fork-arti that is recorded in Cargo.lock but not compiled into
  # any AlterChat target (`cargo tree -i crypto-bigint` is empty).
  "RUSTSEC-2026-0387",
]
