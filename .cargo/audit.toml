# cargo audit configuration.
#
# Every ignored advisory below is pulled in by a dependency whose fix needs a
# major-version migration. Each entry is tracked in a GitHub issue and must be
# removed as soon as the migration lands. New advisories still fail CI.

[advisories]
ignore = [
  # --- libp2p 0.56 -> 0.57 migration (tracked: issue #34) ---
  # hickory-proto/-resolver 0.25 via libp2p-dns. AlterChat does not enable
  # DNSSEC validation, so the DNSSEC advisories do not apply; the parser
  # panics/CPU issues are reachable only from the configured system resolver.
  "RUSTSEC-2026-0118", "RUSTSEC-2026-0119", "RUSTSEC-2026-0487",
  "RUSTSEC-2026-0489", "RUSTSEC-2026-0490", "RUSTSEC-2026-0491",
  "RUSTSEC-2026-0504", "RUSTSEC-2026-0505", "RUSTSEC-2026-0511",
  "RUSTSEC-2026-0512", "RUSTSEC-2026-0530", "RUSTSEC-2026-0531",
  "RUSTSEC-2026-0532", "RUSTSEC-2026-0549", "RUSTSEC-2026-0550",
  "RUSTSEC-2026-0551", "RUSTSEC-2026-0514",
  # libp2p-gossipsub 0.49: PRUNE backoff state growth (fixed in 0.50.1,
  # which requires libp2p 0.57). Peers are rate limited by AlterChat's own
  # connection limits in the meantime.
  "RUSTSEC-2026-0534",

  # --- arti 0.24 upgrade (tracked: issue #35) ---
  # libsqlite3-sys 0.30: only one libsqlite3-sys may be linked, and arti's
  # tor-dirmgr pins rusqlite 0.32. AlterChat builds bundled SQLCipher.
  "RUSTSEC-2026-0459",
  # ring 0.16 via x509-signature in tor-rtcompat (AES panic with overflow
  # checks; release builds do not enable overflow checks).
  "RUSTSEC-2025-0009",
  # rsa 0.9 (Marvin timing attack) via tor-llcrypto; used only for verifying
  # Tor directory signatures, never for decryption with a local private key.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5 via the same RustCrypto stack; no fixed 0.5 release.
  "RUSTSEC-2026-0387",
]
